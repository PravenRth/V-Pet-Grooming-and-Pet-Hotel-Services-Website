<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — V Pet</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px); z-index: 100;
    }
    .admin-topbar .nav-logo { font-size: 18px; font-weight: 600; }
    .admin-topbar .nav-logo sup { font-size: 10px; color: var(--grey); }
    .logout-btn {
      background: none; border: 1px solid var(--border); cursor: pointer;
      font-family: var(--font); font-size: 13px; font-weight: 500;
      padding: 8px 16px; border-radius: 20px; color: var(--black);
    }
    .logout-btn:hover { background: var(--light); }

    .dash-wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px 96px; }
    .dash-wrap h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.6px; margin-bottom: 6px; }
    .dash-sub { font-size: 14px; color: var(--grey); margin-bottom: 40px; }

    #dash-status { font-size: 14px; color: var(--grey); padding: 40px 0; text-align: center; }

    .dash-section {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px 28px 32px; margin-bottom: 28px;
    }
    .dash-section h2 {
      font-size: 16px; font-weight: 700; letter-spacing: -0.2px;
      margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
    }
    .dash-field { margin-bottom: 18px; }
    .dash-field:last-child { margin-bottom: 0; }
    .dash-field label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--grey); margin-bottom: 6px;
    }
    .dash-field .hint { font-size: 12px; color: var(--grey); font-weight: 400; margin-top: 4px; }
    .dash-field input[type="text"],
    .dash-field textarea {
      width: 100%; padding: 11px 14px; border-radius: 10px;
      border: 1px solid var(--border); font-size: 14px;
      font-family: var(--font); color: var(--black); background: var(--white);
    }
    .dash-field input:focus, .dash-field textarea:focus { outline: none; border-color: var(--blue); }
    .dash-field textarea { min-height: 70px; resize: vertical; }
    .checkbox-row { display: flex; align-items: center; gap: 10px; }
    .checkbox-row input { width: 16px; height: 16px; }
    .checkbox-row label { margin-bottom: 0; font-size: 14px; color: var(--black); font-weight: 500; }

    /* FAQ editor */
    .faq-cat-block {
      border: 1px solid var(--border); border-radius: 14px;
      padding: 20px; margin-bottom: 18px; background: var(--light);
    }
    .faq-cat-block-head { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
    .faq-cat-block-head input {
      flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
      font-size: 14px; font-weight: 600; font-family: var(--font);
    }
    .faq-q-row {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
    }
    .faq-q-row label { font-size: 11px; font-weight: 600; color: var(--grey); display: block; margin-bottom: 4px; }
    .faq-q-row input, .faq-q-row textarea {
      width: 100%; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--border); font-size: 13px; font-family: var(--font);
      margin-bottom: 10px;
    }
    .faq-q-row textarea { min-height: 50px; resize: vertical; margin-bottom: 8px; }
    .small-btn {
      background: none; border: 1px solid var(--border); cursor: pointer;
      font-family: var(--font); font-size: 12px; font-weight: 500;
      padding: 6px 12px; border-radius: 16px; color: var(--black);
    }
    .small-btn:hover { background: var(--light); }
    .small-btn.danger { color: #B91C1C; border-color: #FCA5A5; }
    .small-btn.danger:hover { background: #FEF2F2; }
    .add-btn {
      background: var(--black); color: white; border: none; cursor: pointer;
      font-family: var(--font); font-size: 13px; font-weight: 600;
      padding: 10px 18px; border-radius: 20px;
    }
    .add-btn:hover { background: #000; }

    .save-bar {
      position: sticky; bottom: 0; background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px); border-top: 1px solid var(--border);
      padding: 16px 24px; display: flex; align-items: center; gap: 16px;
      justify-content: flex-end; margin: 0 -24px;
    }
    .save-btn {
      background: var(--blue); color: white; border: none; cursor: pointer;
      font-family: var(--font); font-size: 15px; font-weight: 600;
      padding: 12px 28px; border-radius: 30px;
    }
    .save-btn:hover { background: var(--blue-dk); }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #save-message { font-size: 13px; }
    #save-message.success { color: #15803D; }
    #save-message.error { color: #B91C1C; }
  </style>
</head>
<body>

  <div class="admin-topbar">
    <a href="index.html" class="nav-logo">V Pet <sup>Skudai</sup></a>
    <button class="logout-btn" id="logout-btn">Log Out</button>
  </div>

  <div class="dash-wrap">
    <h1>Site Settings</h1>
    <p class="dash-sub">Edit your contact info, banner and FAQ below. Changes go live on the website as soon as you save.</p>

    <p id="dash-status">Loading your site settings…</p>

    <form id="dash-form" style="display:none;">

      <div class="dash-section">
        <h2>Contact Info</h2>
        <div class="dash-field">
          <label for="f-phone">Phone number (as shown to customers)</label>
          <input type="text" id="f-phone" placeholder="011-3602 0431" />
        </div>
        <div class="dash-field">
          <label for="f-whatsapp">WhatsApp number</label>
          <input type="text" id="f-whatsapp" placeholder="601136020431" />
          <p class="hint">Digits only, starting with country code (e.g. 60 for Malaysia). No + or spaces.</p>
        </div>
        <div class="dash-field">
          <label for="f-address">Shop address</label>
          <textarea id="f-address" placeholder="83, Jalan Seri Impian 1, Taman Impian Emas, 83100 Skudai, Johor"></textarea>
        </div>
        <div class="dash-field">
          <label for="f-openingDays">Opening days</label>
          <input type="text" id="f-openingDays" placeholder="Tuesday – Sunday" />
        </div>
        <div class="dash-field">
          <label for="f-openingHours">Opening hours</label>
          <input type="text" id="f-openingHours" placeholder="10am – 7pm" />
        </div>
      </div>

      <div class="dash-section">
        <h2>Top Banner</h2>
        <div class="dash-field checkbox-row">
          <input type="checkbox" id="f-showBanner" />
          <label for="f-showBanner">Show a promo banner at the top of every page</label>
        </div>
        <div class="dash-field">
          <label for="f-bannerText">Banner message</label>
          <input type="text" id="f-bannerText" placeholder="🎉 New customers get 10% off their first grooming session!" />
        </div>
      </div>

      <div class="dash-section">
        <h2>FAQ</h2>
        <div id="faq-editor"></div>
        <button type="button" class="add-btn" id="add-category-btn">+ Add Category</button>
      </div>

      <div class="save-bar">
        <p id="save-message"></p>
        <button type="submit" class="save-btn" id="save-btn">Save Changes</button>
      </div>
    </form>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const statusEl = document.getElementById("dash-status");
    const form = document.getElementById("dash-form");
    const faqEditor = document.getElementById("faq-editor");
    const saveMessage = document.getElementById("save-message");

    let faqData = [];

    // ── Auth guard: only signed-in admins get past this point ──
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "admin.html";
        return;
      }
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        const role = snap.exists() ? snap.data().role : null;
        if (role !== "admin") {
          await signOut(auth);
          window.location.href = "admin.html";
          return;
        }
        await loadConfig();
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Something went wrong loading the dashboard. Please refresh.";
      }
    });

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "admin.html";
    });

    async function loadConfig() {
      const snap = await getDoc(doc(db, "config", "site"));
      const c = snap.exists() ? snap.data() : {};

      document.getElementById("f-phone").value = c.phone || "";
      document.getElementById("f-whatsapp").value = c.whatsapp || "";
      document.getElementById("f-address").value = c.address || "";
      document.getElementById("f-openingDays").value = c.openingDays || "";
      document.getElementById("f-openingHours").value = c.openingHours || "";
      document.getElementById("f-showBanner").checked = !!c.showBanner;
      document.getElementById("f-bannerText").value = c.bannerText || "";

      faqData = Array.isArray(c.faq) ? c.faq : [];
      renderFaqEditor();

      statusEl.style.display = "none";
      form.style.display = "block";
    }

    function renderFaqEditor() {
      faqEditor.innerHTML = "";
      faqData.forEach((section, catIndex) => {
        const block = document.createElement("div");
        block.className = "faq-cat-block";

        const head = document.createElement("div");
        head.className = "faq-cat-block-head";

        const catInput = document.createElement("input");
        catInput.type = "text";
        catInput.value = section.category || "";
        catInput.placeholder = "Category name (e.g. Grooming)";
        catInput.addEventListener("input", () => { faqData[catIndex].category = catInput.value; });

        const removeCatBtn = document.createElement("button");
        removeCatBtn.type = "button";
        removeCatBtn.className = "small-btn danger";
        removeCatBtn.textContent = "Remove Category";
        removeCatBtn.addEventListener("click", () => {
          faqData.splice(catIndex, 1);
          renderFaqEditor();
        });

        head.appendChild(catInput);
        head.appendChild(removeCatBtn);
        block.appendChild(head);

        (section.questions || []).forEach((item, qIndex) => {
          const row = document.createElement("div");
          row.className = "faq-q-row";

          const qLabel = document.createElement("label");
          qLabel.textContent = "Question";
          const qInput = document.createElement("input");
          qInput.type = "text";
          qInput.value = item.q || "";
          qInput.addEventListener("input", () => { faqData[catIndex].questions[qIndex].q = qInput.value; });

          const aLabel = document.createElement("label");
          aLabel.textContent = "Answer";
          const aInput = document.createElement("textarea");
          aInput.value = item.a || "";
          aInput.addEventListener("input", () => { faqData[catIndex].questions[qIndex].a = aInput.value; });

          const removeQBtn = document.createElement("button");
          removeQBtn.type = "button";
          removeQBtn.className = "small-btn danger";
          removeQBtn.textContent = "Remove Question";
          removeQBtn.addEventListener("click", () => {
            faqData[catIndex].questions.splice(qIndex, 1);
            renderFaqEditor();
          });

          row.appendChild(qLabel);
          row.appendChild(qInput);
          row.appendChild(aLabel);
          row.appendChild(aInput);
          row.appendChild(removeQBtn);
          block.appendChild(row);
        });

        const addQBtn = document.createElement("button");
        addQBtn.type = "button";
        addQBtn.className = "small-btn";
        addQBtn.textContent = "+ Add Question";
        addQBtn.addEventListener("click", () => {
          if (!faqData[catIndex].questions) faqData[catIndex].questions = [];
          faqData[catIndex].questions.push({ q: "", a: "" });
          renderFaqEditor();
        });
        block.appendChild(addQBtn);

        faqEditor.appendChild(block);
      });
    }

    document.getElementById("add-category-btn").addEventListener("click", () => {
      faqData.push({ category: "", questions: [{ q: "", a: "" }] });
      renderFaqEditor();
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById("save-btn");
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";
      saveMessage.textContent = "";
      saveMessage.className = "";

      const config = {
        phone: document.getElementById("f-phone").value.trim(),
        whatsapp: document.getElementById("f-whatsapp").value.trim(),
        address: document.getElementById("f-address").value.trim(),
        openingDays: document.getElementById("f-openingDays").value.trim(),
        openingHours: document.getElementById("f-openingHours").value.trim(),
        showBanner: document.getElementById("f-showBanner").checked,
        bannerText: document.getElementById("f-bannerText").value.trim(),
        faq: faqData
      };

      try {
        await setDoc(doc(db, "config", "site"), config);
        saveMessage.textContent = "Saved! Your changes are now live.";
        saveMessage.className = "success";
      } catch (err) {
        console.error(err);
        saveMessage.textContent = "Couldn't save changes. Please try again.";
        saveMessage.className = "error";
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save Changes";
      }
    });
  </script>
</body>
</html>
